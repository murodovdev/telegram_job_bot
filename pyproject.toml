# Tooling configuration (lint + tests). No build backend — this project is
# run as a script, not packaged.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the project root on sys.path so `import bot.*` works when CI invokes the
# bare `pytest` console script (which, unlike `python -m pytest`, does not add
# the current directory to sys.path).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conservative, low-noise ruleset focused on real bugs rather than style:
#   F   — pyflakes (undefined names, unused imports, f-string mistakes)
#   E9  — syntax / runtime-breaking errors
# Line-length and other cosmetic rules are intentionally left off so the lint
# stays signal-heavy on this existing codebase.
select = ["F", "E9"]
ignore = ["E501"]
